services:
  app:
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    profiles: ["api"]
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_PUBLIC_API_URL:?FRONTEND_PUBLIC_API_URL is required}
    container_name: frontend
    environment:
      NODE_ENV: production
      API_URL: http://app:8000
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

