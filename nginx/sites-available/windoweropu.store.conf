upstream windoweropu_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name windoweropu.store www.windoweropu.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://windoweropu.store$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.windoweropu.store;

    ssl_certificate /etc/letsencrypt/live/windoweropu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windoweropu.store/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    return 301 https://windoweropu.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name windoweropu.store;

    ssl_certificate /etc/letsencrypt/live/windoweropu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windoweropu.store/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security.conf;

    access_log /var/log/nginx/frontend.access.log main;
    error_log /var/log/nginx/frontend.error.log warn;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://windoweropu_frontend;
    }
}
